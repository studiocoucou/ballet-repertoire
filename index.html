<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#291d30">
  <meta name="description" content="バレーレペトワ 2025 オープニング映像">
  <title>オープニング映像 | バレーレペトワ</title>
  <style>
    :root { color-scheme: light; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; color: #302936; background: #faf7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; }
    main { width: min(100% - 40px, 1040px); margin: auto; padding: 64px 0 40px; }
    .eyebrow { margin: 0 0 12px; color: #866b50; font-size: 12px; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 40px); font-weight: 500; letter-spacing: .08em; line-height: 1.5; }
    .subtitle { margin: 12px 0 32px; color: #716773; font-size: 14px; line-height: 1.8; }
    .player { position: relative; overflow: hidden; border-radius: 10px; background: #130f17; box-shadow: 0 14px 44px #291d301c; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .play { position: absolute; inset: 0; width: 100%; border: 0; padding: 24px; display: flex; gap: 14px; flex-direction: column; justify-content: center; align-items: center; color: #fff; background: #130f1733; font: inherit; cursor: pointer; }
    .play[hidden], [hidden] { display: none !important; }
    .play-icon { display: grid; place-items: center; width: 72px; height: 72px; padding-left: 4px; border: 1px solid #ffffffb0; border-radius: 50%; font-size: 28px; background: #291d30c9; }
    .play-label { padding: 7px 12px; background: #130f17b3; border-radius: 4px; font-size: 14px; }
    button:focus-visible, a:focus-visible { outline: 3px solid #c28c4e; outline-offset: 5px; }
    .below { display: flex; justify-content: space-between; gap: 16px; margin: 18px 0 0; color: #716773; font-size: 13px; line-height: 1.8; }
    .duration { white-space: nowrap; }
    #error { margin-top: 20px; padding: 16px; border: 1px solid #d9c7c0; border-radius: 6px; line-height: 1.8; font-size: 14px; }
    a { color: #69476b; text-underline-offset: 4px; }
    footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #e7dfd8; color: #94858e; font-size: 12px; letter-spacing: .08em; }
    @media (max-width: 600px) { main { width: calc(100% - 32px); padding-top: 40px; } .subtitle { margin-bottom: 24px; } .below { display: block; } .duration { display: block; margin-top: 6px; } .play-icon { width: 60px; height: 60px; font-size: 23px; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">REPERTOIRE 2025</p>
    <h1>バレーレペトワ</h1>
    <p class="subtitle">オープニング映像</p>
    <div class="player">
      <video id="video" controls playsinline preload="metadata" poster="poster.jpg" aria-label="バレーレペトワ 2025 オープニング映像">
        <source src="opening.mp4" type="video/mp4">
        お使いのブラウザでは動画を再生できません。<a href="opening.mp4">動画を開く</a>
      </video>
      <button class="play" id="play" type="button" aria-label="音声付きで動画を再生" hidden>
        <span class="play-icon" aria-hidden="true">▶</span>
        <span class="play-label">タップして再生</span>
      </button>
    </div>
    <div class="below"><span id="status" aria-live="polite">音声付きの映像です。端末の音量をご確認ください。</span><span class="duration">1分49秒</span></div>
    <div id="error" role="alert" hidden>動画を読み込めませんでした。通信状況をご確認のうえ、<a href="opening.mp4">動画を直接開く</a>か、ページを再読み込みしてください。</div>
    <noscript><p>動画の再生ボタンを押すと再生できます。</p></noscript>
    <footer>バレーレペトワ · 2025</footer>
  </main>
  <script>
    const video = document.getElementById('video');
    const button = document.getElementById('play');
    const status = document.getElementById('status');
    const error = document.getElementById('error');
    button.hidden = false;
    button.addEventListener('click', async () => {
      button.hidden = true;
      try {
        video.muted = false;
        await video.play();
      } catch {
        if (video.error) error.hidden = false;
        else button.hidden = false;
        status.textContent = '再生ボタンを押して、もう一度お試しください。';
      }
    });
    video.addEventListener('playing', () => {
      button.hidden = true;
      status.textContent = '端末を横向きにすると、大きな画面でご覧いただけます。';
    });
    video.addEventListener('ended', () => {
      button.hidden = false;
      button.querySelector('.play-label').textContent = 'もう一度再生';
      button.setAttribute('aria-label', '動画をもう一度再生');
      status.textContent = 'ご覧いただきありがとうございました。';
    });
    video.addEventListener('error', () => { button.hidden = true; error.hidden = false; });
  </script>
</body>
</html>
